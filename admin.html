  // Kategori yang benar-benar merender thumbnail foto tipe "hidangan" di
  // index.html (grid kartu + signature-dish). Kategori di luar daftar ini
  // yang SUDAH punya foto komposisi tidak pernah menampilkan foto hidangan
  // baru -- lihat renderCardListSection/renderSignatureSection/
  // renderListSection di index.html.
  var DISH_THUMBNAIL_CATEGORIES = { "special-menu": true, "nasi-liwet": true, "dessert": true, "signature-dish": true };

  function categoryHasKomposisiPhoto(catId) {
    return state.foto.some(function (x) { return x.tipe === "komposisi" && x.kategori_id === catId; });
  }

  function openFotoSheet(idx) {
    var isNewEntry = idx < 0;
    var f = isNewEntry ? { file: null, nama: "", tipe: "hidangan", kategori_id: null, item: null, alpha: false, yakin: true } : state.foto[idx];
    var isHero = f.tipe === "hero";
    var catOptions = state.menu.kategori.map(function (c) {
      return '<option value="' + escapeHtml(c.id) + '"' + (c.id === f.kategori_id ? " selected" : "") + '>' + escapeHtml(c.nama) + '</option>';
    }).join("");

    var body =
      '<div class="field"><label>Foto</label>' +
        '<div class="thumb-preview" id="fotoPreviewWrap">' + (f.file ? '<img id="fotoPreviewImg" src="' + escapeHtml(photoSrc(f.file)) + '" alt="">' : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:rgba(245,239,227,.4);font-size:12px;">Belum ada foto</div>') + '</div>' +
        '<input type="file" accept="image/*" id="fFile" class="input">' +
        '<div class="file-status" id="fFileStatus"></div>' +
      '</div>' +
      '<div class="field"><label for="fFotoNama">Nama / caption</label><input class="input" id="fFotoNama" value="' + escapeHtml(f.nama || "") + '" placeholder="mis. Alaska King Crab"></div>' +
      (isHero ?
        '<p class="hint" style="margin-bottom:14px;">Foto ini bertipe "Sampul" (foto utama di halaman menu) -- tipe, kategori, dan item tidak berlaku untuk foto sampul.</p>' :
        '<div class="field"><label for="fFotoTipe">Tipe</label><select class="select" id="fFotoTipe">' +
          '<option value="hidangan"' + (f.tipe === "hidangan" ? " selected" : "") + '>Hidangan (foto 1 menu spesifik)</option>' +
          '<option value="komposisi"' + (f.tipe === "komposisi" ? " selected" : "") + '>Komposisi (foto gabungan/showcase kategori)</option>' +
        '</select></div>' +
        '<div class="field"><label for="fFotoKategori">Kategori</label><select class="select" id="fFotoKategori"><option value="">-- pilih kategori --</option>' + catOptions + '</select></div>' +
        '<div class="field" id="fFotoItemWrap"><label for="fFotoItem">Item</label><select class="select" id="fFotoItem"></select><span class="hint" id="fFotoItemHint"></span></div>'
      );

    var footer =
      (isNewEntry ? "" : '<button type="button" class="btn btn-danger" id="deleteFotoBtn" style="flex:0 0 auto;width:auto;padding:12px 14px;">Hapus</button>') +
      '<button type="button" class="btn btn-ghost" id="fotoCancelBtn">Batal</button>' +
      '<button type="button" class="btn btn-primary" id="fotoSaveBtn">Terapkan</button>';

    openSheet(isNewEntry ? "Tambah Foto" : "Edit Foto", body, footer);

    var pendingResize = null; // {blob, ext, width, height} hasil resize terakhir
    var fotoSaveBtn = document.getElementById("fotoSaveBtn");
    function setFotoBusy(busy) {
      fotoSaveBtn.disabled = busy;
      fotoSaveBtn.textContent = busy ? "Memproses..." : "Terapkan";
    }

    if (!isHero) {
      var fFotoTipe = document.getElementById("fFotoTipe");
      var fFotoKategori = document.getElementById("fFotoKategori");
      var fFotoItemWrap = document.getElementById("fFotoItemWrap");
      var fFotoItem = document.getElementById("fFotoItem");
      var fFotoItemHint = document.getElementById("fFotoItemHint");

      function refreshItemOptions() {
        var isHidangan = fFotoTipe.value === "hidangan";
        fFotoItemWrap.classList.toggle("is-hidden", !isHidangan);
        if (!isHidangan) return;
        var cat = findCategory(fFotoKategori.value);
        if (!cat || !cat.item.length) {
          fFotoItem.innerHTML = "";
          fFotoItemHint.textContent = cat ? 'Kategori ini tidak punya item satuan (seafood segar) -- pilih tipe "Komposisi".' : "Pilih kategori dulu.";
          return;
        }
        if (!DISH_THUMBNAIL_CATEGORIES[cat.id] && categoryHasKomposisiPhoto(cat.id)) {
          fFotoItemHint.textContent = 'Kategori ini pakai satu foto komposisi -- foto hidangan baru TIDAK akan tampil di menu online.';
        } else {
          fFotoItemHint.textContent = "";
        }
        fFotoItem.innerHTML = cat.item.map(function (it) {
          return '<option value="' + escapeHtml(it.nama) + '"' + (it.nama === f.item ? " selected" : "") + '>' + escapeHtml(it.nama) + '</option>';
        }).join("");
      }
      fFotoTipe.addEventListener("change", refreshItemOptions);
      fFotoKategori.addEventListener("change", refreshItemOptions);
      refreshItemOptions();
    }

    document.getElementById("fFile").addEventListener("change", function (ev) {
      var file = ev.target.files && ev.target.files[0];
      var statusEl = document.getElementById("fFileStatus");
      if (!file) return;
      setFotoBusy(true);
      statusEl.innerHTML = '<span class="spinner" style="display:inline-block;vertical-align:middle;"></span> Memproses foto...';
      resizeImageFile(file).then(function (result) {
        if (result.blob.size > MAX_PHOTO_BYTES) {
          statusEl.innerHTML = '<div class="sheet-warn" style="background:rgba(212,42,32,.16);border-color:#D42A20;color:#ffd7d2;">Ukuran foto masih ' + formatKB(result.blob.size) + ' setelah dikompres -- terlalu besar (maks 600 KB). Coba pilih foto lain.</div>';
          pendingResize = null;
          setFotoBusy(false);
          return;
        }
        pendingResize = result;
        var url = URL.createObjectURL(result.blob);
        document.getElementById("fotoPreviewWrap").innerHTML = '<img src="' + url + '" alt="">';
        if (result.blob.size > TARGET_PHOTO_BYTES) {
          statusEl.innerHTML = '<div class="sheet-warn">Ukuran ' + formatKB(result.blob.size) + ' -- agak besar (idealnya di bawah 300 KB), tapi masih boleh dipakai.</div>';
        } else {
          statusEl.innerHTML = '<div class="sheet-ok">Siap -- ukuran ' + formatKB(result.blob.size) + ' (format .' + result.ext + ').</div>';
        }
        setFotoBusy(false);
      }).catch(function (err) {
        statusEl.innerHTML = '<div class="sheet-warn" style="background:rgba(212,42,32,.16);border-color:#D42A20;color:#ffd7d2;">' + escapeHtml(err.message || "Gagal memproses foto.") + '</div>';
        pendingResize = null;
        setFotoBusy(false);
      });
    });

    var fotoInitialSnapshot = (isHero ? "" : snapshotFormFields(["fFotoTipe", "fFotoKategori", "fFotoItem"])) + "|" + (document.getElementById("fFotoNama") || {}).value;
    setSheetDirtyCheck(function () {
      if (pendingResize) return true;
      var cur = (isHero ? "" : snapshotFormFields(["fFotoTipe", "fFotoKategori", "fFotoItem"])) + "|" + document.getElementById("fFotoNama").value;
      return cur !== fotoInitialSnapshot;
    });

    document.getElementById("fotoCancelBtn").addEventListener("click", requestCloseSheet);
    if (!isNewEntry) {
      document.getElementById("deleteFotoBtn").addEventListener("click", function () { confirmDeleteFoto(idx); });
    }
    fotoSaveBtn.addEventListener("click", function () {
      if (fotoSaveBtn.disabled) return;
      setFotoBusy(true);
      submitFotoSheet(idx, isNewEntry, isHero, f, pendingResize, function onFail() { setFotoBusy(false); });
    });
  }

  function submitFotoSheet(idx, isNewEntry, isHero, original, pendingResize, onFail) {
    var nama = document.getElementById("fFotoNama").value.trim();
    if (!nama) { sheetSetError("Isi nama/caption foto dulu."); if (onFail) onFail(); return; }
    if (isNewEntry && !pendingResize) { sheetSetError("Pilih file foto dulu."); if (onFail) onFail(); return; }

    var tipe = isHero ? "hero" : document.getElementById("fFotoTipe").value;
    var kategoriId = isHero ? null : document.getElementById("fFotoKategori").value;
    if (!isHero && !kategoriId) { sheetSetError("Pilih kategori dulu."); if (onFail) onFail(); return; }
    var itemNama = null;
    if (tipe === "hidangan") {
      var sel = document.getElementById("fFotoItem");
      itemNama = sel && sel.value ? sel.value : null;
      if (!itemNama) { sheetSetError("Pilih item untuk foto tipe Hidangan."); if (onFail) onFail(); return; }
    }

    var entry = isNewEntry ? { alpha: false, yakin: true } : original;
    entry.nama = nama;
    if (!isHero) {
      entry.tipe = tipe;
      entry.kategori_id = kategoriId;
      if (tipe === "hidangan") entry.item = itemNama;
      else delete entry.item;
    }

    var oldFile = original.file;
    if (pendingResize) {
      var existingOthers = allFilenames().filter(function (fn) { return fn !== oldFile; });
      var newFilename = uniqueFilename(nama, pendingResize.ext, existingOthers);
      entry.file = newFilename;
      var localUrl = URL.createObjectURL(pendingResize.blob);
      state.localPreviewUrls[newFilename] = localUrl;
      blobToBase64(pendingResize.blob).then(function (base64) {
        var newPath = "assets/foto/" + newFilename;
        // De-dupe: kalau (mis. double-tap) sudah ada op put ke path yang
        // sama, cabut yang lama dulu -- jangan sampai ada 2 PUT ke path sama.
        state.pendingImageOps = state.pendingImageOps.filter(function (op) { return op.path !== newPath; });
        state.pendingImageOps.push({ type: "put", path: newPath, base64: base64, label: "Unggah foto " + newFilename });
        if (oldFile && oldFile !== newFilename && state.mode === "token") {
          scheduleOldFileDeletion(oldFile);
        }
        finalizeFotoSubmit(idx, isNewEntry, entry);
      });
      return;
    }
    finalizeFotoSubmit(idx, isNewEntry, entry);
  }

  // Sinkron sepenuhnya -- Git Data API (tree entry sha:null) tidak butuh sha
  // file lama, beda dari Contents API DELETE. Jadi tidak ada lagi jeda async
  // "GET sha dulu" yang bisa ke-skip kalau user buru-buru tekan Simpan.
  function scheduleOldFileDeletion(filename) {
    var path = "assets/foto/" + filename;
    var hadPendingPut = false;
    state.pendingImageOps = state.pendingImageOps.filter(function (op) {
      if (op.type === "put" && op.path === path) { hadPendingPut = true; return false; }
      return true;
    });
    if (hadPendingPut) {
      // File itu belum pernah ke-server (masih upload lokal yang dibatalkan
      // sebelum sempat Simpan) -- cukup batalkan, jangan kirim DELETE.
      if (state.localPreviewUrls[filename]) {
        try { URL.revokeObjectURL(state.localPreviewUrls[filename]); } catch (e) { /* ignore */ }
        delete state.localPreviewUrls[filename];
      }
      return;
    }
    state.pendingImageOps.push({ type: "delete", path: path, label: "Hapus foto lama " + filename });
  }

  function finalizeFotoSubmit(idx, isNewEntry, entry) {
    if (isNewEntry) {
      state.foto.push(entry);
      recordChange('Tambah foto "' + entry.file + '"');
    } else {
      recordChange('Edit foto "' + entry.file + '"');
    }
    state.fotoDirty = true;
    persistDraft();
    closeSheet();
    showToast(APPLIED_TOAST_MSG);
    renderMainArea();
  }

  function schedulePhotoEntryDeletion(fotoEntry) {
    var idx = state.foto.indexOf(fotoEntry);
    if (idx === -1) return;
    state.foto.splice(idx, 1);
    state.fotoDirty = true;
    if (fotoEntry.file && state.mode === "token") scheduleOldFileDeletion(fotoEntry.file);
  }

  function confirmDeleteFoto(idx) {
    var f = state.foto[idx];
    var body = '<p>Hapus foto "<strong>' + escapeHtml(f.nama || f.file) + '</strong>" (' + escapeHtml(f.file) + ')?</p>' +
      '<p style="margin-top:10px;color:rgba(245,239,227,0.6);font-size:12.5px;">File foto & entrinya akan dihapus saat kamu tekan "Simpan Perubahan".</p>';
    openConfirmSheet("Hapus Foto?", body, "Ya, hapus", true, function () {
      schedulePhotoEntryDeletion(f);
      recordChange('Hapus foto "' + f.file + '"');
      closeSheet();
      renderMainArea();
    });
  }

  /* =========================================================
     Validasi + alur Simpan
     ========================================================= */
  function runAllValidations() {
    var problems = validateMenuData(state.menu);
    problems = problems.concat(validatePhotoRefs(state.menu, state.foto));
    var curIds = state.menu.kategori.map(function (c) { return c.id; });
    problems = problems.concat(validateCategoryIds(state.origCategoryIds, curIds));
    return problems;
  }

  function startSaveFlow() {
    if (!state.mode) return;
    var problems = runAllValidations();
    if (problems.length) { showProblemsSheet(problems); return; }
    // Mode demo boleh sampai ke ringkasan (buat lihat alurnya) tapi tidak
    // pernah butuh nama pengirim -- itu cuma dipakai di pesan commit asli.
    if (state.mode === "token" && !state.userName) {
      openNameSheet(function (name) {
        state.userName = name;
        saveUserName(name);
        showChangeSummarySheet();
      });
      return;
    }
    showChangeSummarySheet();
  }

  function showProblemsSheet(problems) {
    var body = '<p style="margin-bottom:10px;">Ada yang perlu diperbaiki dulu sebelum bisa disimpan:</p>' +
      '<ul class="problem-list">' + problems.map(function (p) { return "<li>" + escapeHtml(p) + "</li>"; }).join("") + '</ul>';
    var footer = '<button type="button" class="btn btn-primary" id="problemsCloseBtn" style="width:100%;">Mengerti, saya perbaiki dulu</button>';
    openSheet("Belum Bisa Disimpan", body, footer);
    document.getElementById("problemsCloseBtn").addEventListener("click", closeSheet);
  }

  // Ringkasan changeLog sebelum benar-benar kirim ke server -- supaya salah
  // hapus/salah edit kelihatan dulu sebelum ikut ke-commit (bukan cuma
  // angka "N perubahan" di savebar).
  function showChangeSummarySheet() {
    var isDemo = state.mode === "demo";
    var items = state.changeLog.map(function (c) {
      var isHapus = /^Hapus /.test(c);
      return '<li class="progress-item"' + (isHapus ? ' style="color:#ffb6ae;"' : "") + '><span>' + escapeHtml(c) + '</span></li>';
    }).join("");
    var body = '<p style="margin-bottom:10px;"><strong>' + state.changeLog.length + '</strong> perubahan berikut akan naik ke menu live:</p>' +
      '<ul class="progress-list">' + items + '</ul>' +
      (isDemo ? '<p class="hint" style="margin-top:10px;">Mode demo -- tombol kirim di bawah dinonaktifkan. Tidak ada yang benar-benar terkirim ke server.</p>' : "");
    var footer = '<button type="button" class="btn btn-ghost" id="summaryBackBtn">Kembali</button>' +
      '<button type="button" class="btn btn-primary" id="summaryConfirmBtn"' + (isDemo ? " disabled" : "") + '>' + (isDemo ? "Kirim (nonaktif)" : "Lanjut Simpan") + '</button>';
    openSheet("Ringkasan Perubahan (" + state.changeLog.length + ")", body, footer);
    document.getElementById("summaryBackBtn").addEventListener("click", closeSheet);
    if (!isDemo) {
      document.getElementById("summaryConfirmBtn").addEventListener("click", function () { executeSave(); });
    }
  }

  function openNameSheet(onDone) {
    var body = '<div class="field"><label for="fUserName">Nama kamu</label><input class="input" id="fUserName" placeholder="mis. Nia"></div>' +
      '<p class="hint">Dipakai supaya kelihatan siapa yang mengubah menu (tersimpan di HP ini, cuma ditanya sekali).</p>';
    var footer = '<button type="button" class="btn btn-ghost" id="nameCancelBtn">Batal Simpan</button><button type="button" class="btn btn-primary" id="nameOkBtn">Lanjut</button>';
    openSheet("Nama Kamu", body, footer);
    document.getElementById("nameCancelBtn").addEventListener("click", function () {
      closeSheet();
      showToast('Simpan dibatalkan -- perubahanmu masih menunggu, tekan "Simpan Perubahan" lagi kapan saja.');
    });
    document.getElementById("nameOkBtn").addEventListener("click", function () {
      var name = document.getElementById("fUserName").value.trim();
      if (!name) { sheetSetError("Isi nama dulu, ya."); return; }
      closeSheet();
      onDone(name);
    });
  }

  function commitMessage() {
    return "CMS: " + buildCommitSummary(state.changeLog, 220) + " — oleh " + state.userName;
  }

  // 1 "Simpan Perubahan" = 1 commit atomik lewat Git Data API. Blob dibuat
  // dulu (aman -- tidak nempel ke branch mana pun, tidak memicu deploy Pages
  // apa pun hasilnya), baru langkah terakhir (commitAtomic) yang benar-benar
  // memindah ref cabang -- itu satu-satunya titik yang bisa "berhasil" atau
  // "gagal total", tidak ada state campuran di antaranya.
  function buildAtomicSteps() {
    var steps = [];
    var blobShaByPath = {};
    var putOps = state.pendingImageOps.filter(function (op) { return op.type === "put"; });
    var deletePaths = state.pendingImageOps.filter(function (op) { return op.type === "delete"; }).map(function (op) { return op.path; });
    var putPaths = putOps.map(function (op) { return op.path; });

    if (putOps.length) {
      steps.push({
        label: "Menyiapkan " + putOps.length + " foto baru",
        run: function () {
          return Promise.all(putOps.map(function (op) {
            return githubCreateBlob(op.base64).then(function (res) { blobShaByPath[op.path] = res.sha; });
          }));
        }
      });
    }
    if (state.fotoDirty) {
      steps.push({
        label: "Menyiapkan data/foto.json",
        run: function () {
          var content = base64EncodeUtf8(JSON.stringify(state.foto, null, 2) + "\n");
          return githubCreateBlob(content).then(function (res) { blobShaByPath["data/foto.json"] = res.sha; });
        }
      });
    }
    if (state.menuDirty) {
      steps.push({
        label: "Menyiapkan data/menu.json",
        run: function () {
          var content = base64EncodeUtf8(JSON.stringify(state.menu, null, 2) + "\n");
          return githubCreateBlob(content).then(function (res) { blobShaByPath["data/menu.json"] = res.sha; });
        }
      });
    }
    steps.push({
      label: "Menyimpan 1 commit ke GitHub",
      run: function () {
        return commitAtomic({ putPaths: putPaths, deletePaths: deletePaths, blobShaByPath: blobShaByPath });
      }
    });
    return steps;
  }

  function executeSave() {
    var steps = buildAtomicSteps();
    var body = '<ul class="progress-list" id="progressList">' + steps.map(function (s, i) {
      return '<li class="progress-item progress-item--pending" id="progressStep' + i + '"><span class="progress-icon">' + (i + 1) + '</span><span>' + escapeHtml(s.label) + '</span></li>';
    }).join("") + '</ul><div id="progressResult" style="margin-top:14px;"></div>';
    openSheetNoClose("Menyimpan...", body);
    runStepsSequentially(steps, 0);
  }

  function openSheetNoClose(title, bodyHtml) {
    closeSheet();
    var overlay = document.createElement("div");
    overlay.className = "sheet-overlay";
    overlay.id = "sheetOverlay";
    overlay.innerHTML = '<div class="sheet"><div class="sheet-header"><h2>' + escapeHtml(title) + '</h2></div><div class="sheet-body" id="sheetBody">' + bodyHtml + '</div></div>';
    document.body.appendChild(overlay);
  }

  function runStepsSequentially(steps, i) {
    if (i >= steps.length) { onSaveAllSuccess(); return; }
    var stepEl = document.getElementById("progressStep" + i);
    stepEl.querySelector(".progress-icon").innerHTML = '<span class="spinner"></span>';
    steps[i].run().then(function () {
      stepEl.className = "progress-item progress-item--ok";
      stepEl.querySelector(".progress-icon").textContent = "✓";
      updateSaveBar();
      runStepsSequentially(steps, i + 1);
    }).catch(function (err) {
      stepEl.className = "progress-item progress-item--fail";
      stepEl.querySelector(".progress-icon").textContent = "!";
      onSaveError(err);
    });
  }

  function onSaveAllSuccess() {
    state.changeLog = [];
    clearDraftFromSession();
    // localPreviewUrls SENGAJA tidak dibuang -- foto yang baru diunggah
    // tetap dirender dari blob lokal (bukan URL Pages yang belum ter-deploy,
    // ~1 menit) sampai reload berikutnya. Ditandai recentlyUploaded supaya
    // badge kartu foto berubah dari "Belum diunggah" -> "Menuju website".
    Object.keys(state.localPreviewUrls).forEach(function (fn) { state.recentlyUploaded[fn] = true; });
    var result = document.getElementById("progressResult");
    result.innerHTML = '<div class="sheet-ok">Tersimpan! Menu live akan terupdate &plusmn;1 menit.</div>' +
      '<p style="margin-top:10px;"><a href="' + LIVE_URL + '" target="_blank" rel="noopener">' + LIVE_URL + '</a></p>' +
      '<button type="button" class="btn btn-primary" id="afterSaveOkBtn" style="margin-top:14px;">Selesai</button>';
    document.getElementById("afterSaveOkBtn").addEventListener("click", function () {
      closeSheet();
      renderApp();
    });
    updateSaveBar();
  }

  function onSaveError(err) {
    var result = document.getElementById("progressResult");
    if (err.isSaveConflict) {
      result.innerHTML = '<div class="sheet-error">Ada perubahan lain yang masuk ke server duluan. Perubahanmu di sini <strong>tidak dibuang</strong> (sudah otomatis tersimpan di HP ini) -- muat data terbaru dulu, lalu coba terapkan ulang.</div>' +
        '<button type="button" class="btn btn-primary" id="reloadAfterConflictBtn" style="margin-top:12px;">Muat Data Terbaru</button>';
      document.getElementById("reloadAfterConflictBtn").addEventListener("click", function () { closeSheet(); goLoadingThenApp(); });
    } else if (err.status === 401) {
      result.innerHTML = '<div class="sheet-error">Token salah atau kedaluwarsa. Silakan keluar dan login ulang dengan token yang masih berlaku.</div>' +
        '<button type="button" class="btn btn-primary" id="logoutAfterErrBtn" style="margin-top:12px;">Keluar</button>';
      document.getElementById("logoutAfterErrBtn").addEventListener("click", function () { closeSheet(); doLogout(); });
    } else if (err.status === 403) {
      result.innerHTML = '<div class="sheet-error">GitHub membatasi terlalu banyak permintaan (rate limit) atau token tidak punya izin cukup. Tunggu beberapa menit lalu coba lagi, atau cek izin token (Contents: Read and write).</div>' +
        '<button type="button" class="btn btn-ghost" id="closeErrBtn" style="margin-top:12px;">Tutup</button>';
      document.getElementById("closeErrBtn").addEventListener("click", closeSheet);
    } else {
      result.innerHTML = '<div class="sheet-error">Gagal menyimpan: ' + escapeHtml(friendlyErrorText(err)) + '</div>' +
        '<button type="button" class="btn btn-primary" id="retrySaveBtn" style="margin-top:12px;">Coba Lagi</button>';
      document.getElementById("retrySaveBtn").addEventListener("click", function () { closeSheet(); executeSave(); });
    }
  }

  /* =========================================================
     beforeunload -- peringatan kalau ada perubahan belum tersimpan
     ========================================================= */
  if (typeof window !== "undefined") {
    window.addEventListener("beforeunload", function (e) {
      if (state.mode === "token" && isDirty()) {
        e.preventDefault();
        e.returnValue = "";
      }
    });
  }

  /* =========================================================
     Init
     ========================================================= */
  function initApp() {
    var demoParam = false;
    try { demoParam = new URLSearchParams(location.search).get("demo") === "1"; } catch (e) { demoParam = false; }
    if (demoParam) { enterDemoMode(); return; }
    var stored = loadStoredToken();
    if (stored) {
      state.token = stored;
      state.mode = "token";
      renderShell('<div class="center-loading"><div class="spinner"></div><p>Menyambungkan...</p></div>');
      githubVerifyToken().then(function (result) {
        state.defaultBranch = result.defaultBranch;
        state.tokenPermWarning = result.permWarning;
        goLoadingThenApp();
      }).catch(function (err) {
        // Cuma hapus token yang tersimpan kalau GitHub BENERAN menolaknya
        // (401) -- error jaringan/rate-limit/5xx bukan salah token, dan
        // token cuma ditampilkan GitHub sekali (tidak ada salinan lain).
        if (err && err.status === 401) {
          clearStoredToken();
          state.token = null;
          state.mode = null;
          goLogin("Sesi sebelumnya berakhir, silakan masuk lagi.");
          return;
        }
        renderShell(
          '<div class="center-loading">' +
            '<p style="color:#ffb6ae;">Gagal menghubungi GitHub -- token tetap tersimpan.<br>' + escapeHtml(friendlyErrorText(err)) + '</p>' +
            '<button type="button" class="btn btn-outline" id="retryVerifyBtn" style="width:auto;">Coba lagi</button>' +
            '<button type="button" class="btn btn-ghost" id="goLoginInsteadBtn" style="width:auto;">Masuk dengan token lain</button>' +
          '</div>'
        );
        document.getElementById("retryVerifyBtn").addEventListener("click", initApp);
        document.getElementById("goLoginInsteadBtn").addEventListener("click", function () { goLogin(); });
      });
      return;
    }
    goLogin();
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initApp);
    else initApp();
  }

  // Guard ekspor untuk verifikasi lewat Node (tidak berpengaruh di browser).
  if (typeof module !== "undefined" && module.exports) {
    module.exports = {
      escapeHtml: escapeHtml,
      formatRibuan: formatRibuan,
      parseRibuan: parseRibuan,
      generateHargaLabel: generateHargaLabel,
      isNewDesc: isNewDesc,
      kebabCase: kebabCase,
      uniqueFilename: uniqueFilename,
      computeResizeDims: computeResizeDims,
      formatKB: formatKB,
      base64EncodeUtf8: base64EncodeUtf8,
      base64DecodeUtf8: base64DecodeUtf8,
      buildCommitSummary: buildCommitSummary,
      validateMenuData: validateMenuData,
      validatePhotoRefs: validatePhotoRefs,
      validateCategoryIds: validateCategoryIds,
      validateDataIntegrity: validateDataIntegrity,
      applyPlusPlusSuffix: applyPlusPlusSuffix,
      isWritePermissionLevel: isWritePermissionLevel,
      friendlyErrorText: friendlyErrorText,
      buildAtomicTreeEntries: buildAtomicTreeEntries,
      encodePath: encodePath,
      NEW_DESC: NEW_DESC
    };
  }
})();
</script>
</body>
</html>
