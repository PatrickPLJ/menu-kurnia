<style>
  :root {
    /* — Navy: restyle v2 "Dark Blue Gold", sinkron assets/bg2/brand-colors-v2.json — */
    --sea-sky:    #364580;   /* retired -- garis_tekstur json, aksen langka/fallback frame */
    --sea-bright: #364580;   /* retired, sama seperti --sea-sky */
    --sea-panel:  var(--panel); /* retired, alias --panel */
    --navy-deep:  #0B192B;   /* navy_dasar (brand-colors-v2.json) */
    --navy-ink:   #122A48;   /* turunan navy_dasar, sedikit lebih terang -- footer & fallback foto */
    --navy-abyss: #060E19;   /* turunan navy_dasar, ujung gradasi/scrim paling gelap */

    /* — Hitam-emas (dari hlm 5 & 19, ikut design-spec v2 §2b/§8) — */
    --black-lux:    #0C0B09;
    --black-lux-2:  #161310;
    --gold:         #DAB140;   /* emas_utama (brand-colors-v2.json) */
    --gold-bright:  #F0DE79;   /* emas_terang (brand-colors-v2.json) */
    --gold-soft:    #EDC66B;
    --gold-grad: linear-gradient(180deg, #F2E186 0%, #F0DE79 45%, #B89124 100%);
    --gold-name:       #E9C87E;   /* nama item -- champagne */
    --gold-grad-panel: linear-gradient(160deg, #F1E080 0%, #F0DE79 55%, #D0A328 100%);

    /* — Merah & netral — */
    --red:        #D42A20;
    --red-deep:   #90262A;
    --cream:      #F5EFE3;
    --paper:      #FFFFFF;
    --white:      #FFFFFF;

    /* — Turunan fungsional — */
    --panel:        #1D3154;   /* navy_panel (brand-colors-v2.json) */
    --panel-border: rgba(240,222,121,0.22);
    --gold-border:  rgba(240,222,121,0.45);
    --scrim-hero: linear-gradient(180deg, rgba(6,14,25,0.15) 0%, rgba(6,14,25,0.35) 55%, var(--navy-deep) 100%);
    --scrim-card: linear-gradient(180deg, rgba(6,14,25,0) 45%, rgba(6,14,25,0.82) 100%);

    --sticky-h: 132px;
    --font-serif: 'Playfair Display', Georgia, 'Times New Roman', 'Hiragino Mincho ProN', 'Yu Mincho', 'Apple SD Gothic Neo', 'PingFang SC', serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hiragino Sans', 'Yu Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', 'PingFang SC', 'Microsoft YaHei', Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: clip; }
  html { -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) {
    html { scroll-behavior: smooth; }
  }
  body {
    background: var(--navy-deep);
    color: var(--cream);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; display: block; }
  ul, ol { list-style: none; margin: 0; padding: 0; }
  a { color: inherit; }
  button { font-family: inherit; }
  h1, h2, h3 { font-family: var(--font-serif); color: var(--white); margin: 0; font-weight: 600; }
  p { margin: 0; }
  sup { font-size: 0.62em; letter-spacing: 0.02em; }

  .is-hidden { display: none !important; }

  /* ---------- Skip link (a11y) ---------- */
  .skip-link {
    position: absolute;
    top: -60px;
    left: 12px;
    z-index: 100;
    background: var(--gold-grad);
    color: #241A05;
    font-weight: 600;
    font-size: 0.9375rem;
    padding: 10px 18px;
    border-radius: 999px;
    text-decoration: none;
    transition: top 0.2s ease;
  }
  .skip-link:focus-visible { top: 12px; }

  /* ---------- Background layer (fixed, iOS-safe -- BUKAN background-attachment) ---------- */
  .bg-ocean {
    position: fixed;
    inset: 0;
    z-index: -1;
    /* .bg-ocean fixed = selalu pas 1 viewport (bukan tinggi dokumen), jadi
       bg2-tile cukup di-"cover" sekali (tanpa repeat) -> tidak pernah ada
       sambungan/seam horizontal ATAU vertikal di ukuran layar mana pun.
       (background-size:100% auto + repeat-y sempat dicoba tapi bg2-tile
       570px lebih pendek dari viewport -> menimbulkan seam vertikal.) */
    background-image:
      url("assets/bg2/bg2-tile.webp"),
      linear-gradient(180deg, var(--navy-ink) 0%, var(--navy-abyss) 100%);
    background-repeat: no-repeat, no-repeat;
    background-position: center, top left;
    background-size: cover, cover;
    /* bg2-tile sudah gelap-jadi (garis diagonal tipis di atas navy) -> render
       normal, tanpa blend-mode/opacity redam seperti tile lama. */
    pointer-events: none;
  }

  /* ---------- Loading / error states ---------- */
  .state-panel {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    gap: 16px;
  }
  .spinner {
    align-self: center;
    width: 40px; height: 40px;
    border: 3px solid rgba(245,239,227,0.2);
    border-top-color: var(--gold-bright);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .state-panel h2 { font-size: 1.375rem; margin-bottom: 4px; }
  .state-panel p { color: var(--cream); max-width: 440px; margin: 0 auto; overflow-wrap: break-word; }
  .state-panel code {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 1rem;
  }

  /* ---------- Layout helpers ---------- */
  .page-container {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 18px;
  }
  .sig-grid, .segar-grid { max-width: 760px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 48px 20px 72px;
    text-align: center;
  }
  .hero-bg {
    position: absolute; inset: 0;
    background: url("assets/bg2/bg2-cover-top.webp") center top / cover no-repeat,
                linear-gradient(180deg, var(--navy-ink) 0%, var(--navy-deep) 70%);
  }
  .hero-scrim { position: absolute; inset: 0; background: var(--scrim-hero); }
  .hero-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
    max-width: 640px;
    margin: 0 auto;
    min-width: 0;
  }
  .hero-logo {
    width: 148px; height: auto; margin: 0 auto 2px; align-self: center;
    filter: drop-shadow(0 4px 14px rgba(6,14,25,0.45));
  }
  .hero h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); line-height: 1.15; overflow-wrap: break-word; }
  .hero-tagline {
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 0.8125rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-top: 2px;
  }
  .hero-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 2px; max-width: 100%; }
  .badge-halal {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 8px;
    background: rgba(11,25,43,0.5);
    border: 1px solid rgba(240,222,121,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 999px;
    padding: 6px 14px;
    min-height: 40px;
    justify-content: center;
    max-width: 100%;
  }
  .badge-halal strong { color: var(--gold-soft); font-size: 0.9375rem; white-space: nowrap; }
  .badge-halal span { font-size: 0.9375rem; color: var(--cream); opacity: 0.85; overflow-wrap: anywhere; }
  .hero-address { font-size: 0.9375rem; color: var(--cream); opacity: 0.9; max-width: 460px; margin: 0 auto; overflow-wrap: break-word; }
  .hero-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; max-width: 100%; }

  /* ---------- Language switcher: pill di hero ---------- */
  .lang-pill {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    gap: 2px;
    margin: 8px auto 0;
    padding: 4px;
    background: rgba(11,25,43,0.5);
    border: 1px solid rgba(240,222,121,0.35);
    border-radius: 999px;
    max-width: 100%;
  }
  .lang-pill-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 32px;
    min-width: 34px;
    padding: 4px 10px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--cream);
    opacity: 0.8;
    font-size: 0.8125rem;
    font-weight: 600;
    cursor: pointer;
  }
  .lang-pill-btn.is-active {
    background: var(--gold-grad);
    color: #241A05;
    opacity: 1;
    box-shadow: 0 2px 8px rgba(218,177,64,0.35);
  }
  .lang-pill-sep { color: rgba(245,239,227,0.35); font-size: 0.75rem; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .btn-gold { background: var(--gold-grad); color: #241A05; box-shadow: 0 4px 14px rgba(218,177,64,0.35); }
  .btn-outline { background: transparent; color: var(--gold-soft); border-color: rgba(240,222,121,0.6); }

  /* ---------- Global notice (ringkas + details) ---------- */
  .global-notice {
    background: var(--panel);
    border-top: 1px solid var(--panel-border);
    border-bottom: 1px solid var(--panel-border);
    padding: 8px 20px;
  }
  .global-notice-inner { max-width: 760px; margin: 0 auto; }
  .global-notice-slim {
    font-size: 0.9375rem;
    color: var(--gold-soft);
    padding: 4px 0;
    text-align: center;
  }
  .global-details { margin-top: 2px; }
  .global-details summary {
    cursor: pointer;
    font-size: 0.9375rem;
    color: var(--cream);
    opacity: 0.8;
    padding: 4px 0;
    min-height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    list-style: none;
  }
  .global-details summary::-webkit-details-marker { display: none; }
  .global-details summary::after { content: " ▾"; }
  .global-details[open] summary::after { content: " ▴"; }
  .global-details ul { padding-top: 4px; }
  .global-details li {
    font-size: 1rem;
    color: var(--cream);
    opacity: 0.85;
    padding: 3px 0 3px 18px;
    position: relative;
  }
  .global-details li::before {
    content: "•";
    color: var(--gold);
    position: absolute;
    left: 0;
  }

  /* ---------- Sticky search + nav ---------- */
  .sticky-bar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(7,13,24,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(240,222,121,0.25);
  }
  .search-row { padding: 10px 18px 6px; }
  .search-row-inner { display: flex; align-items: center; gap: 8px; }
  .search-box { position: relative; flex: 1; min-width: 0; }

  /* ---------- Language switcher: tombol globe di sticky-bar ---------- */
  .lang-globe-wrap { position: relative; flex: none; }
  .lang-globe-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(7,13,24,0.7);
    border: 1px solid rgba(240,222,121,0.30);
    color: var(--gold-soft);
    cursor: pointer;
  }
  .lang-globe-btn:hover, .lang-globe-btn:focus-visible { border-color: var(--gold-soft); }
  .lang-globe-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    z-index: 45;
    min-width: 176px;
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .lang-globe-item {
    display: flex;
    align-items: center;
    min-height: 40px;
    padding: 6px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--cream);
    text-align: left;
    font-size: 0.9375rem;
    font-family: inherit;
    cursor: pointer;
  }
  .lang-globe-item:hover, .lang-globe-item:focus-visible { background: rgba(240,222,121,0.15); }
  .lang-globe-item.is-active { background: var(--gold-grad); color: #241A05; font-weight: 600; }
  .search-box input[type="search"] {
    width: 100%;
    min-height: 44px;
    border-radius: 999px;
    border: 1px solid rgba(240,222,121,0.30);
    background: rgba(7,13,24,0.7);
    color: var(--cream);
    padding: 0 44px 0 16px;
    font-size: 1rem;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  .search-box input[type="search"]::placeholder { color: rgba(245,239,227,0.55); }
  .search-box input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-box input[type="search"]:focus { outline: 2px solid var(--gold-soft); outline-offset: 2px; border-color: var(--gold-soft); }
  .search-icon {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: rgba(245,239,227,0.55); pointer-events: none;
  }
  .search-clear {
    display: none;
    position: absolute;
    right: 0;
    top: 0;
    width: 44px;
    height: 44px;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    padding: 0;
    color: rgba(245,239,227,0.7);
    cursor: pointer;
  }
  .search-clear:hover, .search-clear:focus-visible { color: var(--gold-soft); }
  .search-box.has-value .search-icon { display: none; }
  .search-box.has-value .search-clear { display: flex; }
  .search-result { font-size: 0.9375rem; color: var(--gold-soft); min-height: 20px; padding-top: 4px; }
  .search-empty {
    max-width: 760px;
    margin: 24px auto;
    padding: 0 18px;
    text-align: center;
    color: var(--cream);
    opacity: 0.85;
    font-size: 1rem;
  }
  .chip-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 8px 12px 18px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent 100%);
    mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent 100%);
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid rgba(240,222,121,0.30);
    color: rgba(245,239,227,0.9);
    text-decoration: none;
    font-size: 0.9375rem;
    font-weight: 500;
    background: rgba(11,25,43,0.45);
    scroll-margin-left: 18px;
  }
  .chip.is-active {
    background: var(--gold-grad);
    color: #241A05;
    border-color: transparent;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(218,177,64,0.4);
  }

  /* ---------- Category sections (generic) ---------- */
  .category {
    scroll-margin-top: calc(var(--sticky-h) + 10px);
    padding: 40px 0;
  }
  .category-head { padding: 0 18px; margin-bottom: 14px; }
  .cat-kicker {
    font: 600 0.75rem/1 var(--font-sans);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 6px;
  }
  .cat-num { opacity: 0.7; }
  .category-head h2 {
    font-size: clamp(1.5rem, 5vw, 2rem);
    font-weight: 700;
    background: var(--gold-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--gold-bright);
    -webkit-text-fill-color: transparent;
  }
  @supports not (background-clip: text) {
    .category-head h2 { color: var(--gold-bright); -webkit-text-fill-color: initial; }
  }
  .gold-rule { display: flex; align-items: center; gap: 8px; margin-top: 10px; max-width: 220px; }
  .gold-rule::before, .gold-rule::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, var(--gold) 40%, var(--gold));
  }
  .gold-rule::after { transform: scaleX(-1); }
  .gold-rule-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); flex: none; }
  .category-note {
    font-size: 1rem;
    color: var(--gold-soft);
    opacity: 0.9;
    margin-top: 4px;
  }

  /* ---------- Divider rule+diamond emas antar-section (v2, ganti gelombang) ---------- */
  .rule-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    max-width: 340px;
    margin: 0 auto;
    padding: 26px 18px;
  }
  .rule-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(240,222,121,0.7)); }
  .rule-line--flip { transform: scaleX(-1); }
  .rule-diamond { width: 7px; height: 7px; background: var(--gold-bright); transform: rotate(45deg); flex: none; }

  /* ---------- Menu list (printed-menu style, tanpa thumbnail -> rata kiri konsisten) ---------- */
  .menu-list {
    margin: 0 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(11,25,43,0.78);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .menu-row { display: block; }
  .menu-info { min-width: 0; }
  .menu-name-row { display: flex; align-items: baseline; gap: 6px; }
  .menu-name { font-size: 1rem; font-weight: 500; color: var(--gold-name); }
  .badge-new {
    display: inline-block;
    background: var(--red);
    color: var(--white);
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 9px;
    border-radius: 999px;
    vertical-align: middle;
    margin-left: 2px;
  }
  .menu-dots {
    flex: 1 1 auto;
    min-width: 10px;
    border-bottom: 1px dotted rgba(240,222,121,0.30);
    margin-bottom: 5px;
  }
  .menu-price { flex-shrink: 0; color: var(--gold-bright); font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .menu-meta { font-size: 1rem; color: var(--cream); opacity: 0.75; margin-top: 3px; }

  /* ---------- Gloss (penjelasan singkat nama hidangan) -- muncul saat kamus
     bahasa aktif punya terjemahan gloss, lebih redup dari .menu-meta/.dish-meta ---------- */
  .item-gloss { font-size: 0.9375rem; font-style: italic; color: var(--cream); opacity: 0.55; margin-top: 2px; }
  .item-gloss.is-hidden { display: none; }

  /* ---------- Showcase foto komposisi (satu foto besar di atas kategori) ---------- */
  .category-showcase { max-width: 760px; margin: 0 auto 16px; padding: 0 18px; }
  .category-showcase .showcase-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--panel-border);
  }
  .category-showcase .showcase-frame img { width: 100%; height: 100%; object-fit: cover; }
  /* Foto showcase alpha:true (PNG-alpha diekstrak dari cetakan, sudah di-trim
     ke bounding box konten) -> bingkai TIDAK pakai letterbox rasio-tetap lagi
     (dulu 16/9 atau 4/3 dgn contain = lautan panel kosong / foto terpotong
     tanggung). Tinggi sekarang mengikuti konten, dibatasi max-height supaya
     tidak jadi raksasa di layar besar. */
  .category-showcase .showcase-frame--contain {
    aspect-ratio: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .category-showcase .showcase-frame--contain img {
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 70vh;
    object-fit: contain;
    border-radius: 8px;
  }
  @media (min-width: 640px) {
    .category-showcase .showcase-frame--contain img { max-height: 520px; }
  }
  .category-showcase .showcase-caption {
    font-size: 1rem;
    color: var(--cream);
    opacity: 0.75;
    font-style: italic;
    text-align: center;
    margin-top: 8px;
    max-width: 60ch;
    margin-inline: auto;
  }

  /* ---------- Dish card grid (Special Menu, Nasi Liwet, Dessert) ---------- */
  .dish-grid {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .dish-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .dish-photo { width: 100%; aspect-ratio: 4 / 3; background: var(--navy-ink); }
  .dish-photo img { width: 100%; height: 100%; object-fit: cover; }
  /* Foto alpha (PNG-alpha diekstrak dari cetakan) -> contain + padding
     supaya hidangan tidak kepotong; foto komposisi biasa tetap cover. */
  .dish-photo--contain { padding: 10px; }
  .dish-photo--contain img { object-fit: contain; }
  .dish-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  /* margin-top:auto pada child PERTAMA .dish-body -> baris nama+harga (+ meta
     yang mengikutinya) selalu nempel ke dasar kartu, apa pun tinggi foto atau
     ada/tidaknya foto -- grid row stretch menyamakan tinggi kartu dalam satu
     baris, jadi bar nama+harga jadi sejajar antar-kartu (tidak loncat-loncat). */
  .dish-name-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .dish-name { font-weight: 500; color: var(--gold-name); font-size: 1rem; }
  .dish-price { color: var(--gold-bright); font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .dish-meta { font-size: 1rem; color: var(--cream); opacity: 0.75; }
  @media (hover: hover) and (pointer: fine) {
    .dish-card { transition: transform 0.2s ease, box-shadow 0.2s ease; }
    .dish-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,0.35); }
  }

  /* ---------- Signature dish (hitam-emas, ala hlm 5) ---------- */
  .category--signature {
    background:
      radial-gradient(90% 55% at 12% 0%, rgba(240,222,121,0.16) 0%, transparent 60%),
      radial-gradient(120% 60% at 50% 100%, rgba(240,222,121,0.06) 0%, transparent 55%),
      var(--black-lux);
    border-top: 1px solid rgba(240,222,121,0.5);
    border-bottom: 1px solid rgba(240,222,121,0.5);
    box-shadow: 0 0 40px rgba(240,222,121,0.08) inset;
    padding: 44px 0 52px;
  }
  .sig-head { padding: 0 18px; margin-bottom: 28px; text-align: center; }
  .sig-kicker {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font: 600 0.75rem/1 var(--font-sans);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 14px;
  }
  .sig-kicker-line { flex: 0 1 56px; height: 1px; background: var(--gold-bright); opacity: 0.5; position: relative; }
  .sig-kicker-line::before {
    content: "";
    position: absolute; top: 50%;
    width: 6px; height: 6px;
    background: var(--gold-bright);
    transform: translateY(-50%) rotate(45deg);
  }
  .sig-kicker-line:first-child::before { left: 0; }
  .sig-kicker-line:last-child::before { right: 0; }
  .category--signature h2 {
    text-transform: uppercase;
    font-size: clamp(1.75rem, 7vw, 2.75rem);
    letter-spacing: 0.02em;
    background: var(--gold-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: var(--gold-bright);
    -webkit-text-fill-color: transparent;
  }
  @supports not (background-clip: text) {
    .category--signature h2 { color: var(--gold-bright); -webkit-text-fill-color: initial; }
  }
  .sig-subtag {
    display: inline-block;
    font: 600 0.8125rem/1.4 var(--font-sans);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    background: var(--gold-grad);
    color: #241A05;
    padding: 6px 20px;
    margin-top: 14px;
  }

  .sig-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
  .sig-card {
    position: relative;
    background: var(--black-lux-2);
    border: 1px solid rgba(240,222,121,0.45);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }
  @media (hover: hover) and (pointer: fine) {
    .sig-card { transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
    .sig-card:hover, .sig-card:focus-within { border-color: rgba(240,222,121,0.75); transform: translateY(-2px); }
  }
  .sig-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    background: var(--gold-grad);
    color: #241A05;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 4px;
  }
  .sig-photo { width: 100%; aspect-ratio: 4 / 3; background: var(--black-lux-2); position: relative; }
  .sig-photo img { width: 100%; height: 100%; object-fit: cover; }
  .sig-photo::after { content: ""; position: absolute; inset: 0; background: var(--scrim-card); pointer-events: none; }
  .sig-body { padding: 18px; }
  .sig-ribbon {
    font: 600 0.6875rem/1 var(--font-sans);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold-bright);
    margin-bottom: 6px;
  }
  .sig-body h3 { font-size: 1.375rem; font-weight: 700; color: var(--gold-bright); margin-bottom: 8px; }
  .sig-desc { font-size: 1rem; color: var(--cream); opacity: 0.85; line-height: 1.55; }
  .sig-price-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .sig-price { color: var(--gold-bright); font-weight: 700; font-size: 1.25rem; }
  .sig-satuan { font-size: 0.9375rem; color: var(--cream); opacity: 0.75; }
  .sig-sizes { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
  .sig-size-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid rgba(240,222,121,0.15);
  }
  .sig-size-label { font-size: 0.9375rem; color: var(--cream); }
  .sig-size-price { color: var(--gold-bright); font-weight: 600; font-size: 1rem; white-space: nowrap; }

  /* ---------- Seafood segar ---------- */
  .category--segar {
    position: relative;
    isolation: isolate;
    background: var(--navy-ink);
  }
  .category--segar.bg-loaded {
    background: url("assets/bg2/bg2-cover-deep.webp") center / cover no-repeat, var(--navy-ink);
  }
  .category--segar::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, rgba(6,14,25,0.55), rgba(6,14,25,0.78));
  }
  .category--segar .category-head { padding-bottom: 0; }
  .category--segar h2 { font-size: clamp(2rem, 8vw, 3rem); }
  .category--segar .category-showcase .showcase-frame { aspect-ratio: 4 / 3; }
  /* Override khusus supaya foto showcase alpha (mis. udang, kerang) tetap
     tinggi-mengikuti-konten -- bukan ikut letterbox 4/3 kategori segar. */
  .category--segar .category-showcase .showcase-frame--contain { aspect-ratio: auto; }
  .segar-notice {
    max-width: 760px;
    margin: 0 auto 16px;
    padding: 10px 18px;
    background: rgba(11,25,43,0.85);
    border: 1px solid rgba(240,222,121,0.55);
    color: var(--cream);
    border-radius: 999px;
    font-weight: 600;
    font-size: 1rem;
    text-align: center;
  }
  .segar-block { margin-bottom: 18px; }
  .segar-block h3 { font-family: var(--font-sans); font-size: 1rem; font-weight: 600; color: var(--gold-soft); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.03em; }
  /* align-self:start -- panel tidak dipaksa ikut tinggi kolom sebelah (mis.
     Pilihan Ukuran cuma 3 item vs Pilihan Olahan yang lebih panjang), supaya
     tidak ada sisa ruang emas kosong di bawah isi. */
  .segar-block--paper { background: var(--gold-grad-panel); border-radius: 16px; padding: 16px 18px; align-self: start; height: auto; }
  .segar-block--paper h3 {
    font-family: var(--font-serif);
    font-weight: 700;
    font-size: 1.125rem;
    color: #12233F;
    text-transform: none;
    letter-spacing: 0;
    margin-bottom: 10px;
  }
  .segar-varian-list { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .segar-varian-list li {
    font-size: 1rem;
    color: #12233F;
    padding: 4px 0 4px 16px;
    position: relative;
  }
  .segar-varian-list li::before { content: "•"; position: absolute; left: 0; color: #8A6A1E; }
  /* Pill "Pilihan Olahan" -- INFORMASI, bukan kontrol. Sengaja tanpa border
     kapsul/hover/gaya "terpilih" solid supaya tidak terbaca sebagai tombol
     yang bisa dipencet (keluhan awal: "pill terlihat mati/tidak bisa
     dipencet"). Dirender sebagai daftar label datar dengan pemisah titik
     emas; olahan signature tetap menonjol lewat teks emas + ikon berlian. */
  .pill-row { display: flex; flex-wrap: wrap; align-items: center; row-gap: 6px; }
  .pill {
    display: inline-flex;
    align-items: center;
    color: var(--cream);
    font-size: 0.9375rem;
    line-height: 1.3;
    padding: 2px 0;
  }
  .pill:not(:last-child)::after {
    content: "•";
    color: rgba(240,222,121,0.5);
    font-size: 0.7rem;
    margin: 0 10px;
  }
  .pill--hot { color: var(--gold-bright); font-weight: 600; }
  .pill--hot::before {
    content: "◆";
    display: inline-block;
    color: var(--gold-bright);
    font-size: 0.6rem;
    margin-right: 5px;
  }

  /* ---------- Footer ---------- */
  .site-footer {
    background: var(--navy-ink);
    padding: 40px 18px 24px;
  }
  .footer-inner { max-width: 760px; margin: 0 auto; }
  .footer-address h2 { font-size: 1.25rem; }
  .footer-address .gold-rule { margin-bottom: 14px; }
  .footer-address p { font-size: 1rem; opacity: 0.9; margin-bottom: 14px; max-width: 60ch; margin-inline: auto; }
  .footer-links { display: flex; flex-wrap: wrap; gap: 14px; margin: 18px 0; }
  .footer-links a {
    display: inline-flex;
    align-items: center;
    min-height: 44px;

  .footer-cols { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 24px; }
  .footer-cols h3 { font-family: var(--font-sans); font-size: 1rem; color: var(--gold-soft); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }
  .footer-cols li { font-size: 1rem; padding: 3px 0; opacity: 0.9; }
  .footer-notes {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px solid var(--panel-border);

  .footer-notes h3 { font-family: var(--font-sans); font-size: 1rem; color: var(--gold-soft); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.03em; }

    font-size: 1rem;
    color: var(--cream);
    opacity: 0.8;
    padding: 3px 0 3px 18px;

  .footer-notes li::before {
    content: "•";
    color: var(--gold);
    position: absolute;
    left: 0;
  }
  .footer-bottom {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--panel-border);
    text-align: center;
    font-size: 0.8125rem;
    color: rgba(245,239,227,0.6);
  }

  /* ---------- Back to top ---------- */
  .back-to-top {
    position: fixed;
    right: 12px;
    bottom: 12px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--gold-grad);
    color: #241A05;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.35);
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(10px);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s 0.2s;
    z-index: 50;
  }
  .back-to-top.is-visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
    transition: opacity 0.2s ease, transform 0.2s ease, visibility 0s 0s;
  }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translate(-50%, 12px);
    background: var(--panel);
    border: 1px solid var(--gold-soft);
    color: var(--cream);
    padding: 12px 18px;
    border-radius: 12px;
    font-size: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
    max-width: calc(100% - 32px);
    text-align: center;
  }
  .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Micro-interactions (hemat) ---------- */
  .btn, .chip, .pill { transition: transform 0.15s ease, opacity 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
  .btn:active, .chip:active { transform: scale(0.97); }
  :where(a, button, input, summary):focus-visible { outline: 2px solid var(--gold-soft); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }

  /* ---------- Larger screens ---------- */
  @media (min-width: 640px) {
    .sig-grid { grid-template-columns: 1fr 1fr; }
    .dish-grid { grid-template-columns: 1fr 1fr; }
    .segar-grid-inner { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .segar-varian-list { grid-template-columns: 1fr 1fr; column-gap: 20px; }
    .footer-cols { grid-template-columns: 1fr 1fr; }
  }
  /* Container konten desktop: background section tetap full-bleed (tidak
     disentuh di sini), hanya ISI section yang dibatasi & di-center supaya
     enak dibaca di layar lebar. */
  @media (min-width: 900px) {
    .search-row,
    .chip-row,
    .category-head,
    .sig-head,
    .menu-list,
    .dish-grid,
    .sig-grid,
    .segar-grid,
    .category-showcase,
    .footer-inner,
    .global-notice-inner {
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }
  }
  @media (min-width: 960px) {
    .sig-grid { grid-template-columns: repeat(3, 1fr); }
    .dish-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>

    service_charge_notice: "Harga belum termasuk service charge & pajak pemerintah",
    info_harga_catatan: "Info harga & catatan",
    search_placeholder: "Cari menu, misalnya: kepiting",
    search_input_label: "Cari menu",
    search_clear_label: "Hapus pencarian",
    nav_kategori_label: "Kategori menu",
    search_result_count: "{n} menu ditemukan",
    search_empty: 'Tidak ada menu yang cocok dengan "{q}". Coba kata kunci lain, misalnya nama hidangan atau kategori.',
    badge_new: "NEW",
    signature_badge: "Signature",
    signature_kicker: "Signature Dish",
    signature_subtag: "Limited · Exclusive · Premium",
    signature_ribbon_king: "The King of the Crab",
    pilihan_ukuran: "Pilihan Ukuran",
    pilihan_olahan: "Pilihan Olahan",
    tampak_di_foto_prefix: "Tampak di foto: ",
    kunjungi_kami: "Kunjungi Kami",
    buka_di_google_maps: "Buka di Google Maps",
    fasilitas_label: "Fasilitas",
    tersedia_untuk_label: "Tersedia Untuk",
    catatan_label: "Catatan",
    toast_link_copied: "Link menu disalin ke clipboard",
    toast_copy_failed: "Gagal menyalin link, silakan salin manual dari address bar",
    toast_copy_manual: "Silakan salin link dari address bar browser",
    lang_switch_label: "Pilih bahasa"
  };

  var currentLang = DEFAULT_LANG;
  var langDictCache = {}; // lang -> parsed JSON dari data/i18n/{lang}.json (id tidak pernah masuk sini)
  var menuDataGlobal = null; // menu.json mentah (Indonesia) -- sumber fallback semua string
  var catByIdGlobal = {};

  function getDict(lang) {
    return lang === DEFAULT_LANG ? null : (langDictCache[lang] || null);
  }

  // t(key) -- string UI antarmuka, selalu ada fallback ke UI_ID (tidak pernah kosong).
  function t(key) {
    var dict = getDict(currentLang);
    if (dict && dict.ui && dict.ui[key]) return dict.ui[key];
    return UI_ID[key] || "";
  }

  function tCat(catId, field, fallback) {
    var dict = getDict(currentLang);
    if (dict && dict.kategori && dict.kategori[catId] && dict.kategori[catId][field]) return dict.kategori[catId][field];
    return fallback;
  }

  function tItemField(catId, nama, field, fallback) {
    var dict = getDict(currentLang);
    var key = catId + "|" + nama;
    if (dict && dict.items && dict.items[key] && dict.items[key][field]) return dict.items[key][field];
    return fallback;
  }

  // Gloss (penjelasan singkat arti nama hidangan) TIDAK punya fallback ID --
  // kalau belum diterjemahkan, tidak ada baris gloss yang ditampilkan sama sekali.
  function tGloss(catId, nama) {
    var dict = getDict(currentLang);
    var key = catId + "|" + nama;
    if (dict && dict.items && dict.items[key] && dict.items[key].gloss) return dict.items[key].gloss;
    return "";
  }

  // Olahan/varian_ukuran/catatan seafood-segar -- daftar unik lintas kategori,
  // fallback ke string aslinya sendiri (karena itu memang teksnya di Bahasa Indonesia).
  function tOlahan(str) {
    var dict = getDict(currentLang);
    if (dict && dict.olahan && dict.olahan[str]) return dict.olahan[str];
    return str;
  }

  function tCatatan(idx, fallback) {
    var dict = getDict(currentLang);
    if (dict && dict.catatan_global && dict.catatan_global[idx]) return dict.catatan_global[idx];
    return fallback;
  }

  function tRestoran(field, idx, fallback) {
    var dict = getDict(currentLang);
    if (dict && dict.restoran && dict.restoran[field] && dict.restoran[field][idx]) return dict.restoran[field][idx];
    return fallback;
  }

  function getUrlLang() {
    var params = new URLSearchParams(location.search);
    var l = params.get("lang");
    return LANGS.indexOf(l) !== -1 ? l : null;
  }

  function getStoredLang() {
    try {
      var l = localStorage.getItem(LANG_STORAGE_KEY);
      return LANGS.indexOf(l) !== -1 ? l : null;
    } catch (e) {
      return null;
    }
  }

  // Fetch lazy + cache di variabel (langDictCache) supaya ganti-ganti bahasa
  // bolak-balik tidak fetch ulang. File yang belum ada (404) ditangani mulus:
  // tidak melempar error ke console selain satu console.warn informatif, dan
  // seluruh string tetap fallback ke Bahasa Indonesia lewat t()/tCat()/dst.
  function loadLangDict(lang) {
    if (lang === DEFAULT_LANG) return Promise.resolve(null);
    // hasOwnProperty (bukan cuma truthy-check) supaya kegagalan (404) pun
    // ke-cache sebagai null -- tidak fetch ulang tiap kali bahasa yang sama
    // dipilih lagi/di-load ulang dalam sesi yang sama.
    if (Object.prototype.hasOwnProperty.call(langDictCache, lang)) return Promise.resolve(langDictCache[lang]);
    return fetch("data/i18n/" + lang + ".json")
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (data) {
        langDictCache[lang] = data;
        return data;
      })
      .catch(function (err) {
        console.warn("i18n: data/i18n/" + lang + ".json belum tersedia, memakai Bahasa Indonesia untuk string yang belum diterjemahkan.", err);
        langDictCache[lang] = null;
        return null;
      });
  }

  /* =========================================================
     Util murni (tidak menyentuh document) -> bisa dites lewat
     Node tanpa DOM.
     ========================================================= */
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function formatRupiah(n) {
    return "Rp " + Number(n).toLocaleString("id-ID");
  }

  // Format harga ala cetakan "46ᴷ" (angka + <sup>K</sup>), sumber utama
  // harga_label yang sudah ada di menu.json. Suffix apa pun setelah "K"
  // (mis. "++", "/Pcs") dipertahankan apa adanya di luar <sup>.
  function formatPrice(item) {
    var label = item.harga_label || (item.harga != null ? formatRupiah(item.harga) + (item.plus_plus ? "++" : "") : "");
    var m = String(label).match(/^([\d][\d.,]*)K(.*)$/);
    if (m) {
      return escapeHtml(m[1]) + "<sup>K</sup>" + escapeHtml(m[2]);
    }
    return escapeHtml(label);
  }

  function photoDims(file) {
    return PHOTO_DIMS[file] || DEFAULT_DIMS;
  }

  function signatureGroupKey(nama) {
    return String(nama).replace(/\s*\([^)]*\)\s*$/, "").trim();
  }

  // foto.json "nama" untuk tipe komposisi biasanya "Label (Item A, Item B, ...)".
  // Ambil isi kurung sebagai daftar hidangan yang tampak; kalau tidak ada
  // kurung, seluruh nama sudah berupa daftar hidangan itu sendiri.
  function buildKomposisiCaption(nama) {
    var m = String(nama).match(/\(([^)]+)\)\s*$/);
    return m ? m[1] : nama;
  }

  // Beberapa catatan_global sumbernya berbahasa Inggris; brief minta
  // frasa Indonesia persis untuk catatan biaya layanan & pajak. String ID-nya
  // (SERVICE_CHARGE_ID) sekaligus jadi nilai UI_ID.service_charge_notice.
  var SERVICE_CHARGE_RAW = "All prices exclude service charge and government tax";
  var SERVICE_CHARGE_ID = "Harga belum termasuk service charge & pajak pemerintah";

  // Kategori yang dirender sebagai grid kartu bergambar (bukan daftar teks polos)
  var CARD_CATEGORIES = { "special-menu": true, "nasi-liwet": true, "dessert": true, "sweets-delights": true };

  // Olahan "signature" ala cetakan (Saus Kurnia, Garlic Caramel, Saus Padang) ->
  // pill ditonjolkan (varian --hot) di section seafood segar. Daftar exact-match,
  // bukan pencocokan substring.
  var HOT_OLAHAN = { "Saus Kurnia": true, "Garlic Caramel": true, "Saus Padang (Khas Kurnia)": true };

  /**
   * Bangun index foto dari mapping EKSPLISIT di foto.json (field tipe /
   * kategori_id / item) -- tidak ada lagi pencocokan substring otomatis.
   * - tipe "hidangan": itemPhotoMap[kategoriId::namaItemPersis] = file,
   *   divalidasi dulu terhadap menu.json; kalau tidak ketemu -> console.warn
   *   dan foto itu TIDAK dipakai.
   * - tipe "komposisi": komposisiMap[kategoriId] = {file, caption}, dipakai
   *   sebagai satu foto showcase / banner, TIDAK PERNAH jadi thumbnail item.
   * - tipe "hero": heroFile.
   */
  function buildPhotoIndex(menu, fotoList) {
    var catById = {};
    menu.kategori.forEach(function (c) { catById[c.id] = c; });

    var itemPhotoMap = {};
    var komposisiMap = {};
    var alphaByFile = {};
    var heroFile = null;

    fotoList.forEach(function (f) {
      if (f.file) alphaByFile[f.file] = !!f.alpha;

      if (f.tipe === "hero") {
        heroFile = f.file;
        return;
      }

      var cat = catById[f.kategori_id];
      if (!cat) {
        console.warn("foto.json: kategori_id tidak ditemukan di menu.json ->", f.file, "|", f.kategori_id);
        return;
      }

      if (f.tipe === "komposisi") {
        komposisiMap[f.kategori_id] = { file: f.file, captionList: buildKomposisiCaption(f.nama), alpha: !!f.alpha };
        return;
      }

      if (f.tipe === "hidangan") {
        var found = cat.item.some(function (it) { return it.nama === f.item; });
        if (!found) {
          console.warn("foto.json: item tidak ditemukan persis di menu.json ->", f.file, "|", f.item);
          return;
        }
        itemPhotoMap[f.kategori_id + "::" + f.item] = f.file;
        return;
      }

      console.warn("foto.json: tipe tidak dikenali ->", f.file, "|", f.tipe);
    });

    return { itemPhotoMap: itemPhotoMap, komposisiMap: komposisiMap, heroFile: heroFile, alphaByFile: alphaByFile };
  }

  function getItemPhoto(photoIndex, catId, itemNama) {
    return photoIndex.itemPhotoMap[catId + "::" + itemNama] || null;
  }

  // Kategori tanpa foto komposisi tapi kebetulan punya satu foto hidangan
  // (mis. "Fresh Tape Blend" di kategori "others") -> foto itu dipakai
  // sebagai showcase tunggal, bukan thumbnail inline. Hanya dipanggil untuk
  // kategori daftar-teks (bukan kategori kartu).
  function getShowcase(cat, photoIndex) {
    var komposisi = photoIndex.komposisiMap[cat.id];
    if (komposisi) return komposisi;
    var prefix = cat.id + "::";
    for (var key in photoIndex.itemPhotoMap) {
      if (key.indexOf(prefix) === 0) {
        var itemNama = key.slice(prefix.length);
        var file = photoIndex.itemPhotoMap[key];
        return { file: file, captionList: itemNama, alpha: !!photoIndex.alphaByFile[file] };
      }
    }
    return null;
  }

  // Foto showcase alpha:true (PNG-alpha) dirender contain (bukan cover) supaya
  // hidangan tidak terpotong; foto komposisi biasa (raster penuh) tetap cover.
  function renderShowcaseHtml(showcase) {
    if (!showcase) return "";
    var dims = photoDims(showcase.file);
    var frameClass = showcase.alpha ? "showcase-frame showcase-frame--contain" : "showcase-frame";
    return '<figure class="category-showcase"><div class="' + frameClass + '"><img src="assets/foto/' + showcase.file +
      '" alt="" width="' + dims[0] + '" height="' + dims[1] +
      '" loading="lazy" decoding="async"></div><figcaption class="showcase-caption">' +
      '<span data-i18n="tampak_di_foto_prefix">Tampak di foto: </span>' + escapeHtml(showcase.captionList) +
      '</figcaption></figure>';
  }

  /* =========================================================
     Render string builders (murni, return HTML string)
     ========================================================= */

  // Kicker bernomor + h2 + gold-rule berlian, dipakai di SEMUA category-head
  // kecuali Signature Dish (header khusus, lihat renderSignatureSection).
  function renderCategoryHeadHtml(cat, idx, opts) {
    opts = opts || {};
    var num = String(idx + 1);
    if (num.length < 2) num = "0" + num;
    var noteHtml = (!opts.hideNote && cat.catatan) ?
      '<p class="category-note" data-i18n-cat-catatan="' + cat.id + '">' + escapeHtml(cat.catatan) + '</p>' : "";
    return '' +
      '<div class="category-head">' +
        '<p class="cat-kicker"><span class="cat-num">' + num + '</span> &middot; <span data-i18n-cat-nama="' + cat.id + '">' + escapeHtml(cat.nama) + '</span></p>' +
        '<h2 data-i18n-cat-nama="' + cat.id + '">' + escapeHtml(cat.nama) + '</h2>' +
        '<div class="gold-rule" aria-hidden="true"><span class="gold-rule-diamond"></span></div>' +
        noteHtml +
      '</div>';
  }

  // Divider rule+diamond emas, dipakai berulang di titik transisi besar.
  // Nama fungsi & parameter dipertahankan (call-site tidak berubah) -- param
  // colorToken/flip lama sudah tidak dipakai isinya, motif sekarang selalu emas.
  function renderWaveDivider(colorToken, flip) {
    return '<div class="rule-divider" aria-hidden="true">' +
      '<span class="rule-line"></span><span class="rule-diamond"></span><span class="rule-line rule-line--flip"></span>' +
      '</div>';
  }

  // Baris daftar teks polos -- TIDAK PERNAH pakai thumbnail inline, supaya
  // kolom nama & dotted leader rata konsisten di seluruh daftar.
  function renderMenuRow(item, catId) {
    var isNewBadge = item.deskripsi === "Menu baru (NEW)";
    var metaText = (!isNewBadge && item.deskripsi) ? item.deskripsi : "";
    var satuanText = item.satuan || "";
    var metaParts = [satuanText, metaText].filter(Boolean).map(escapeHtml).join(" · ");
    var searchText = (item.nama + " " + (item.deskripsi || "")).toLowerCase();
    var itemKey = catId + "|" + item.nama;

    return '' +
      '<li class="menu-row" data-search="' + escapeHtml(searchText) + '" data-i18n-item-key="' + escapeHtml(itemKey) + '">' +
        '<div class="menu-info">' +
          '<div class="menu-name-row">' +
            '<span class="menu-name">' + escapeHtml(item.nama) + (isNewBadge ? ' <span class="badge-new" data-i18n="badge_new">NEW</span>' : "") + '</span>' +
            '<span class="menu-dots" aria-hidden="true"></span>' +
            '<span class="menu-price">' + formatPrice(item) + '</span>' +
          '</div>' +
          (metaParts ? '<div class="menu-meta">' + metaParts + '</div>' : "") +
          '<p class="item-gloss is-hidden"></p>' +
        '</div>' +
      '</li>';
  }

  function renderListSection(cat, photoIndex, idx) {
    var searchParts = (cat.nama + " " + (cat.catatan || "")).toLowerCase();
    var showcase = getShowcase(cat, photoIndex);
    var itemsHtml = cat.item.map(function (item) { return renderMenuRow(item, cat.id); }).join("");
    return '' +
      '<section class="category" id="cat-' + cat.id + '" data-search="' + escapeHtml(searchParts) + '">' +
        renderCategoryHeadHtml(cat, idx) +
        renderShowcaseHtml(showcase) +
        '<ul class="menu-list">' + itemsHtml + '</ul>' +
      '</section>';
  }

  // Kartu bergambar konsisten untuk Special Menu / Nasi Liwet / Dessert.
  // Item tanpa foto tetap jadi kartu (tanpa area foto), bukan baris teks
  // polos, supaya grid tidak campur gaya.
  function renderDishCard(catId, item, photoIndex) {
    var fotoFile = getItemPhoto(photoIndex, catId, item.nama);
    var isNewBadge = item.deskripsi === "Menu baru (NEW)";
    var metaText = (!isNewBadge && item.deskripsi) ? item.deskripsi : "";
    var satuanText = item.satuan || "";
    var metaParts = [satuanText, metaText].filter(Boolean).map(escapeHtml).join(" · ");
    var searchText = (item.nama + " " + (item.deskripsi || "")).toLowerCase();
    var itemKey = catId + "|" + item.nama;

    var photoHtml = "";
    if (fotoFile) {
      var d = photoDims(fotoFile);
      var photoClass = photoIndex.alphaByFile[fotoFile] ? "dish-photo dish-photo--contain" : "dish-photo";
      photoHtml = '<div class="' + photoClass + '"><img src="assets/foto/' + fotoFile + '" alt="' + escapeHtml(item.nama) +
        '" width="' + d[0] + '" height="' + d[1] + '" loading="lazy" decoding="async"></div>';
    }

    return '' +
      '<article class="dish-card" data-search="' + escapeHtml(searchText) + '" data-i18n-item-key="' + escapeHtml(itemKey) + '">' +
        photoHtml +
        '<div class="dish-body">' +
          '<div class="dish-name-row">' +
            '<span class="dish-name">' + escapeHtml(item.nama) + (isNewBadge ? ' <span class="badge-new" data-i18n="badge_new">NEW</span>' : "") + '</span>' +
            '<span class="dish-price">' + formatPrice(item) + '</span>' +
          '</div>' +
          (metaParts ? '<div class="dish-meta">' + metaParts + '</div>' : "") +
          '<p class="item-gloss is-hidden"></p>' +
        '</div>' +
      '</article>';
  }

  function renderCardListSection(cat, photoIndex, idx) {
    var searchParts = (cat.nama + " " + (cat.catatan || "")).toLowerCase();
    var komposisi = photoIndex.komposisiMap[cat.id];
    var cardsHtml = cat.item.map(function (item) { return renderDishCard(cat.id, item, photoIndex); }).join("");
    return '' +
      '<section class="category" id="cat-' + cat.id + '" data-search="' + escapeHtml(searchParts) + '">' +
        renderCategoryHeadHtml(cat, idx) +
        renderShowcaseHtml(komposisi) +
        '<div class="dish-grid">' + cardsHtml + '</div>' +
      '</section>';
  }

  function renderSegarSection(cat, photoIndex, idx) {
    var banner = photoIndex.komposisiMap[cat.id];
    var varian = cat.varian_ukuran || [];
    var olahan = cat.pilihan_olahan || [];
    var searchParts = [cat.nama, cat.catatan || "", varian.join(" "), olahan.join(" ")].join(" ").toLowerCase();

    return '' +
      '<section class="category category--segar" id="cat-' + cat.id + '" data-search="' + escapeHtml(searchParts) + '">' +
        renderCategoryHeadHtml(cat, idx, { hideNote: true }) +
        renderShowcaseHtml(banner) +
        (cat.catatan ? '<p class="segar-notice" data-i18n-olahan-key="' + escapeHtml(cat.catatan) + '">' + escapeHtml(cat.catatan) + '</p>' : "") +
        '<div class="segar-grid"><div class="segar-grid-inner">' +
          '<div class="segar-block segar-block--paper">' +
            '<h3 data-i18n="pilihan_ukuran">Pilihan Ukuran</h3>' +
            '<ul class="segar-varian-list">' + varian.map(function (v) { return '<li data-i18n-olahan-key="' + escapeHtml(v) + '">' + escapeHtml(v) + '</li>'; }).join("") + '</ul>' +
          '</div>' +
          '<div class="segar-block">' +
            '<h3 data-i18n="pilihan_olahan">Pilihan Olahan</h3>' +
            '<div class="pill-row">' + olahan.map(function (p) {
              var cls = HOT_OLAHAN[p] ? "pill pill--hot" : "pill";
              return '<span class="' + cls + '" data-i18n-olahan-key="' + escapeHtml(p) + '">' + escapeHtml(p) + '</span>';
            }).join("") + '</div>' +
          '</div>' +
        '</div></div>' +
      '</section>';
  }

  function renderSigCard(catId, key, items, photoIndex, isKing) {
    var first = items[0];
    var fotoFile = getItemPhoto(photoIndex, catId, first.nama);
    var dims = fotoFile ? photoDims(fotoFile) : DEFAULT_DIMS;
    var searchText = items.map(function (i) { return i.nama + " " + (i.deskripsi || ""); }).join(" ").toLowerCase();
    var itemKey = catId + "|" + first.nama;

    var bodyHtml;
    if (items.length > 1) {
      var sizeRows = items.map(function (it) {
        var m = it.nama.match(/\(([^)]+)\)\s*$/);
        var sizeLabel = m ? m[1] : it.nama;
        var satuan = it.satuan ? " · " + escapeHtml(it.satuan) : "";
        var sizeKey = catId + "|" + it.nama;
        return '<div class="sig-size-row" data-i18n-size-key="' + escapeHtml(sizeKey) + '"><span class="sig-size-label">' + escapeHtml(sizeLabel) +
          '<span class="sig-size-satuan">' + satuan + '</span></span><span class="sig-size-price">' + formatPrice(it) + '</span></div>';
      }).join("");
      bodyHtml = '<p class="sig-desc">' + escapeHtml(first.deskripsi || "") + '</p>' +
        '<div class="sig-sizes">' + sizeRows + '</div>';
    } else {
      bodyHtml = '<div class="sig-price-row"><span class="sig-price">' + formatPrice(first) + '</span>' +
        (first.satuan ? '<span class="sig-satuan">' + escapeHtml(first.satuan) + '</span>' : "") + '</div>' +
        '<p class="sig-desc">' + escapeHtml(first.deskripsi || "") + '</p>';
    }

    return '' +
      '<article class="sig-card' + (isKing ? ' sig-card--king' : '') + '" data-search="' + escapeHtml(searchText) + '" data-i18n-item-key="' + escapeHtml(itemKey) + '">' +
        '<span class="sig-badge" data-i18n="signature_badge">Signature</span>' +
        (fotoFile ?
          '<div class="sig-photo"><img src="assets/foto/' + fotoFile + '" alt="' + escapeHtml(key) +
          '" width="' + dims[0] + '" height="' + dims[1] + '" loading="lazy" decoding="async"></div>' : "") +
        '<div class="sig-body">' +
          (isKing ? '<p class="sig-ribbon" data-i18n="signature_ribbon_king">The King of the Crab</p>' : "") +
          '<h3>' + escapeHtml(key) + '</h3>' +
          '<p class="item-gloss is-hidden"></p>' +
          bodyHtml +
        '</div>' +
      '</article>';
  }

  function renderSignatureSection(cat, photoIndex) {
    var groups = [];
    var groupIndex = {};
    cat.item.forEach(function (item) {
      var key = signatureGroupKey(item.nama);
      if (!(key in groupIndex)) {
        groupIndex[key] = groups.length;
        groups.push({ key: key, items: [] });
      }
      groups[groupIndex[key]].items.push(item);
    });

    var cardsHtml = groups.map(function (g, i) { return renderSigCard(cat.id, g.key, g.items, photoIndex, i === 0); }).join("");
    var searchParts = (cat.nama + " " + cat.item.map(function (i) { return i.nama + " " + (i.deskripsi || ""); }).join(" ")).toLowerCase();

    return '' +
      '<section class="category category--signature" id="cat-' + cat.id + '" data-search="' + escapeHtml(searchParts) + '">' +
        '<div class="sig-head">' +
          '<p class="sig-kicker"><span class="sig-kicker-line" aria-hidden="true"></span><span data-i18n="signature_kicker">Signature Dish</span><span class="sig-kicker-line" aria-hidden="true"></span></p>' +
          '<h2 data-i18n-cat-nama="' + cat.id + '">' + escapeHtml(cat.nama) + '</h2>' +
          '<p class="sig-subtag" data-i18n="signature_subtag">Limited &middot; Exclusive &middot; Premium</p>' +
        '</div>' +
        '<div class="sig-grid">' + cardsHtml + '</div>' +
      '</section>';
  }

  function renderCategory(cat, photoIndex, idx) {

  function showError(kind) {

  /* =========================================================
     I18N -- terapkan bahasa ke DOM yang sudah dirender (baseline selalu
     Bahasa Indonesia). Dipanggil sekali saat init, lalu tiap kali ganti
     bahasa lewat switcher. Selalu jalan lewat satu jalur yang sama
     (termasuk untuk "id") supaya konsisten & gampang dites.
     ========================================================= */
  function applyItemSimple(rowEl) {
    var key = rowEl.getAttribute("data-i18n-item-key");
    var sep = key.indexOf("|");
    var catId = key.slice(0, sep);
    var nama = key.slice(sep + 1);
    var cat = catByIdGlobal[catId];
    if (!cat) return;
    var item = (cat.item || []).filter(function (it) { return it.nama === nama; })[0];
    if (!item) return;

    var isNewBadge = item.deskripsi === "Menu baru (NEW)";
    var deskripsiSrc = isNewBadge ? "" : (item.deskripsi || "");
    var deskripsi = isNewBadge ? "" : tItemField(catId, nama, "deskripsi", deskripsiSrc);
    var satuan = tItemField(catId, nama, "satuan", item.satuan || "");
    var metaParts = [satuan, deskripsi].filter(Boolean).join(" · ");
    var metaEl = rowEl.querySelector(".menu-meta, .dish-meta");
    if (metaEl) metaEl.textContent = metaParts;

    var gloss = tGloss(catId, nama);
    var glossEl = rowEl.querySelector(".item-gloss");
    if (glossEl) {
      glossEl.textContent = gloss;
      glossEl.classList.toggle("is-hidden", !gloss);
    }

    var searchBits = [nama, deskripsiSrc, deskripsi, item.satuan || "", satuan, gloss].join(" ").toLowerCase();
    rowEl.setAttribute("data-search", searchBits);
  }

  function applySigCard(cardEl) {
    var key = cardEl.getAttribute("data-i18n-item-key");
    var sep = key.indexOf("|");
    var catId = key.slice(0, sep);
    var firstNama = key.slice(sep + 1);
    var cat = catByIdGlobal[catId];
    if (!cat) return;
    var groupKey = signatureGroupKey(firstNama);
    var groupItems = (cat.item || []).filter(function (it) { return signatureGroupKey(it.nama) === groupKey; });
    var first = groupItems[0];
    if (!first) return;

    var deskripsi = tItemField(catId, first.nama, "deskripsi", first.deskripsi || "");
    var descEl = cardEl.querySelector(".sig-desc");
    if (descEl) descEl.textContent = deskripsi;

    var gloss = tGloss(catId, first.nama);
    var glossEl = cardEl.querySelector(".item-gloss");
    if (glossEl) {
      glossEl.textContent = gloss;
      glossEl.classList.toggle("is-hidden", !gloss);
    }

    var searchBits = [];
    groupItems.forEach(function (it) { searchBits.push(it.nama, it.deskripsi || ""); });
    searchBits.push(deskripsi, gloss);

    if (groupItems.length > 1) {
      cardEl.querySelectorAll(".sig-size-row[data-i18n-size-key]").forEach(function (rowEl) {
        var sizeKey = rowEl.getAttribute("data-i18n-size-key");
        var s2 = sizeKey.indexOf("|");
        var itNama = sizeKey.slice(s2 + 1);
        var it = groupItems.filter(function (g) { return g.nama === itNama; })[0];
        if (!it) return;
        var satuan = tItemField(catId, itNama, "satuan", it.satuan || "");
        var satEl = rowEl.querySelector(".sig-size-satuan");
        if (satEl) satEl.textContent = satuan ? " · " + satuan : "";
        searchBits.push(satuan);
      });
    } else {
      var satuan1 = tItemField(catId, first.nama, "satuan", first.satuan || "");
      var satEl1 = cardEl.querySelector(".sig-satuan");
      if (satEl1) satEl1.textContent = satuan1;
      searchBits.push(satuan1);
    }

    cardEl.setAttribute("data-search", searchBits.join(" ").toLowerCase());
  }

  // Refresh data-search di level <section class="category"> supaya pencarian
  // ikut mengenali nama/catatan kategori & varian/olahan yang sedang tampil.
  function refreshCategorySearch() {
    if (!menuDataGlobal) return;
    menuDataGlobal.kategori.forEach(function (cat) {
      var sec = document.getElementById("cat-" + cat.id);
      if (!sec) return;
      var namaT = tCat(cat.id, "nama", cat.nama);
      var bits = [cat.nama, namaT];
      if (cat.tipe === "seafood-segar") {
        if (cat.catatan) bits.push(cat.catatan, tOlahan(cat.catatan));
        (cat.varian_ukuran || []).forEach(function (v) { bits.push(v, tOlahan(v)); });
        (cat.pilihan_olahan || []).forEach(function (p) { bits.push(p, tOlahan(p)); });
      } else if (cat.catatan) {
        bits.push(cat.catatan, tCat(cat.id, "catatan", cat.catatan));
      }
      sec.setAttribute("data-search", bits.join(" ").toLowerCase());
    });
  }

  function updateLangSwitcherUI(lang) {
    document.querySelectorAll(".lang-pill-btn").forEach(function (btn) {
      var isActive = btn.dataset.lang === lang;
      btn.classList.toggle("is-active", isActive);
      btn.setAttribute("aria-pressed", isActive ? "true" : "false");
    });
    document.querySelectorAll(".lang-globe-item").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.dataset.lang === lang);
    });
  }

  function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.lang = lang;

    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
    });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
      el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
    });

    document.querySelectorAll("[data-i18n-cat-nama]").forEach(function (el) {
      var catId = el.getAttribute("data-i18n-cat-nama");
      var cat = catByIdGlobal[catId];
      if (cat) el.textContent = tCat(catId, "nama", cat.nama);
    });
    document.querySelectorAll("[data-i18n-cat-catatan]").forEach(function (el) {
      var catId = el.getAttribute("data-i18n-cat-catatan");
      var cat = catByIdGlobal[catId];
      if (cat) el.textContent = tCat(catId, "catatan", cat.catatan);
    });
    document.querySelectorAll("[data-i18n-olahan-key]").forEach(function (el) {
      el.textContent = tOlahan(el.getAttribute("data-i18n-olahan-key"));
    });
    document.querySelectorAll("[data-i18n-restoran-key]").forEach(function (el) {
      var parts = el.getAttribute("data-i18n-restoran-key").split(".");
      var field = parts[0];
      var idx = parseInt(parts[1], 10);
      var fallback = menuDataGlobal && menuDataGlobal.restoran[field] ? menuDataGlobal.restoran[field][idx] : "";
      el.textContent = tRestoran(field, idx, fallback);
    });
    document.querySelectorAll("[data-i18n-catatan-idx]").forEach(function (el) {
      var idx = parseInt(el.getAttribute("data-i18n-catatan-idx"), 10);
      var orig = menuDataGlobal ? menuDataGlobal.catatan_global[idx] : "";
      el.textContent = orig === SERVICE_CHARGE_RAW ? t("service_charge_notice") : tCatatan(idx, orig);
    });

    document.querySelectorAll(".menu-row[data-i18n-item-key], .dish-card[data-i18n-item-key]").forEach(applyItemSimple);
    document.querySelectorAll(".sig-card[data-i18n-item-key]").forEach(applySigCard);
    refreshCategorySearch();

    if (!document.getElementById("errorState").classList.contains("is-hidden")) {
      showError(document.getElementById("errorState").dataset.kind || "network");
    }

    var input = document.getElementById("searchInput");
    applySearch(input ? input.value : "");

    updateLangSwitcherUI(lang);
  }

  function setLanguage(lang) {
    if (LANGS.indexOf(lang) === -1) lang = DEFAULT_LANG;
    return loadLangDict(lang).then(function () {
      currentLang = lang;
      applyLanguage(lang);
      try { localStorage.setItem(LANG_STORAGE_KEY, lang); } catch (e) {}
      var url = new URL(location.href);
      if (lang === DEFAULT_LANG) { url.searchParams.delete("lang"); } else { url.searchParams.set("lang", lang); }
      var newRelative = url.pathname + url.search + url.hash;
      if (newRelative !== location.pathname + location.search + location.hash) {
        history.replaceState(null, "", newRelative);
      }
    });
  }

  function closeLangGlobeMenu() {
    var menu = document.getElementById("langGlobeMenu");
    var btn = document.getElementById("langGlobeBtn");
    if (menu) menu.classList.add("is-hidden");
    if (btn) btn.setAttribute("aria-expanded", "false");
  }

  function setupLangSwitcher() {
    document.querySelectorAll(".lang-pill-btn, .lang-globe-item").forEach(function (btn) {
      btn.addEventListener("click", function () {
        setLanguage(btn.dataset.lang);
        closeLangGlobeMenu();
      });
    });

    var globeBtn = document.getElementById("langGlobeBtn");
    var globeMenu = document.getElementById("langGlobeMenu");
    if (globeBtn && globeMenu) {
      globeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var willOpen = globeMenu.classList.contains("is-hidden");
        globeMenu.classList.toggle("is-hidden", !willOpen);
        globeBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });
      document.addEventListener("click", function (e) {
        if (!globeMenu.classList.contains("is-hidden") && !globeBtn.contains(e.target) && !globeMenu.contains(e.target)) {
          closeLangGlobeMenu();
        }
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeLangGlobeMenu();
      });
    }
  }

  function setupStickyHeight() {
    var sticky = document.querySelector(".sticky-bar");
    if (!sticky) return;
    function update() {
      document.documentElement.style.setProperty("--sticky-h", sticky.offsetHeight + "px");
    }
    update();
    window.addEventListener("resize", update);
  }

  function setupObserver() {
    var sections = document.querySelectorAll(".category[id]");
    if (!sections.length || typeof IntersectionObserver === "undefined") return;
    var chips = document.querySelectorAll(".chip");
    var chipByTarget = {};
    chips.forEach(function (c) { chipByTarget[c.dataset.target] = c; });
    var chipRow = document.getElementById("chipRow");

    function setActive(id) {
      chips.forEach(function (c) {
        var isActive = c.dataset.target === id;
        c.classList.toggle("is-active", isActive);
        if (isActive) { c.setAttribute("aria-current", "true"); } else { c.removeAttribute("aria-current"); }
      });
      var active = chipByTarget[id];
      if (active && chipRow) {
        var target = active.offsetLeft - chipRow.clientWidth / 2 + active.clientWidth / 2;
        chipRow.scrollTo({ left: Math.max(0, target), behavior: (prefersReducedMotion && prefersReducedMotion.matches) ? "auto" : "smooth" });
      }
    }

    var stickyH = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--sticky-h")) || 132;
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) setActive(entry.target.id);
      });
    }, { rootMargin: "-" + stickyH + "px 0px -70% 0px", threshold: 0 });

    sections.forEach(function (sec) { observer.observe(sec); });
  }

  function applySearch(query) {
    var q = query.trim().toLowerCase();
    var sections = document.querySelectorAll(".category");
    var resultEl = document.getElementById("searchResult");
    var emptyEl = document.getElementById("searchEmpty");
    var visibleCount = 0;

    if (!q) {
      sections.forEach(function (sec) {
        sec.classList.remove("is-hidden");
        sec.querySelectorAll("[data-search]").forEach(function (el) { el.classList.remove("is-hidden"); });
      });
      if (resultEl) resultEl.textContent = "";
      if (emptyEl) emptyEl.classList.add("is-hidden");
      return;
    }

    sections.forEach(function (sec) {
      var catMatches = (sec.dataset.search || "").indexOf(q) !== -1;
      var rows = sec.querySelectorAll(".menu-row, .sig-card, .dish-card");
      if (rows.length) {
        var anyVisible = false;
        rows.forEach(function (row) {
          var rowMatches = catMatches || (row.dataset.search || "").indexOf(q) !== -1;
          row.classList.toggle("is-hidden", !rowMatches);
          if (rowMatches) { anyVisible = true; visibleCount++; }
        });
        sec.classList.toggle("is-hidden", !anyVisible);
      } else {
        sec.classList.toggle("is-hidden", !catMatches);
        if (catMatches) visibleCount++;
      }
    });

    if (resultEl) resultEl.textContent = t("search_result_count").replace("{n}", String(visibleCount));
    if (emptyEl) {
      if (visibleCount === 0) {
        emptyEl.textContent = t("search_empty").replace("{q}", query.trim());
        emptyEl.classList.remove("is-hidden");
      } else {
        emptyEl.classList.add("is-hidden");
      }
    }
  }

  function setupSearch() {
    var input = document.getElementById("searchInput");
    var box = document.getElementById("searchBox");
    var clearBtn = document.getElementById("searchClear");
    if (!input) return;
    input.addEventListener("input", function () {
      applySearch(input.value);
      if (box) box.classList.toggle("has-value", input.value.length > 0);
    });
    if (clearBtn) {
      clearBtn.addEventListener("click", function () {
        input.value = "";
        applySearch("");
        if (box) box.classList.remove("has-value");
        input.focus();
      });
    }
  }

  function showToast(msg) {
    var toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = msg;
    toast.classList.add("is-visible");
    clearTimeout(toast._hideTimer);
    toast._hideTimer = setTimeout(function () { toast.classList.remove("is-visible"); }, 2500);
  }

  function setupShare() {
    var btn = document.getElementById("shareBtn");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var shareData = { title: document.title, text: "Menu Kurnia Seafood Surabaya", url: location.href };
      if (navigator.share) {
        navigator.share(shareData).catch(function () { /* dibatalkan user, abaikan */ });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(location.href).then(function () {
          showToast(t("toast_link_copied"));
        }).catch(function () {
          showToast(t("toast_copy_failed"));
        });
      } else {
        showToast(t("toast_copy_manual"));
      }
    });
  }

  function setupSegarBgLazyLoad() {
    var els = document.querySelectorAll(".category--segar");
    if (!els.length) return;
    if (typeof IntersectionObserver === "undefined") {
      els.forEach(function (el) { el.classList.add("bg-loaded"); });
      return;
    }
    var observer = new IntersectionObserver(function (entries, obs) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("bg-loaded");
          obs.unobserve(entry.target);
        }
      });
    }, { rootMargin: "800px 0px", threshold: 0 });
    els.forEach(function (el) { observer.observe(el); });
  }

  // Klik chip saat filter search aktif: section target bisa is-hidden
  // (display:none) sehingga anchor-jump native browser tidak berpengaruh.
  // Kosongkan search dulu, baru scroll manual ke section.
  function setupChipRow() {
    var chipRow = document.getElementById("chipRow");
    if (!chipRow) return;
    chipRow.addEventListener("click", function (e) {
      var chip = e.target.closest ? e.target.closest(".chip") : null;
      if (!chip) return;
      var input = document.getElementById("searchInput");
      if (input && input.value.trim()) {
        e.preventDefault();
        input.value = "";
        applySearch("");
        var box = document.getElementById("searchBox");
        if (box) box.classList.remove("has-value");
        var target = document.getElementById(chip.dataset.target);
        if (target) {
          target.scrollIntoView({ behavior: (prefersReducedMotion && prefersReducedMotion.matches) ? "auto" : "smooth", block: "start" });
        }
      }
    });
  }

  function setupBackToTop() {
    var btn = document.getElementById("backToTop");
    if (!btn) return;
    window.addEventListener("scroll", function () {
      btn.classList.toggle("is-visible", window.scrollY > 500);
    });
    btn.addEventListener("click", function () {
      window.scrollTo({ top: 0, behavior: (prefersReducedMotion && prefersReducedMotion.matches) ? "auto" : "smooth" });
    });
  }

  function initApp() {
    // Resolve bahasa awal duluan (?lang= URL menang atas localStorage) supaya
    // kamusnya sudah di-fetch PARALEL dengan menu.json/foto.json -- termasuk
    // supaya state error (file:// / network) pun tampil di bahasa yang benar.
    var initialLang = getUrlLang() || getStoredLang() || DEFAULT_LANG;
    currentLang = initialLang;
    document.documentElement.lang = initialLang;
    var langDictPromise = loadLangDict(initialLang);

    if (location.protocol === "file:") {
      langDictPromise.then(function () { showError("file"); });
      return;
    }

    Promise.all([fetchJson("./data/menu.json"), fetchJson("./data/foto.json"), langDictPromise])
      .then(function (results) {
        var menu = results[0];
        var fotoList = results[1];
        menuDataGlobal = menu;
        catByIdGlobal = {};
        menu.kategori.forEach(function (c) { catByIdGlobal[c.id] = c; });

        var app = document.getElementById("app");
        app.innerHTML = renderAppHtml(menu, fotoList);

        document.getElementById("loadingState").classList.add("is-hidden");
        app.classList.remove("is-hidden");
        document.getElementById("backToTop").classList.remove("is-hidden");

        setupStickyHeight();
        setupObserver();
        setupSearch();
        setupShare();
        setupBackToTop();
        setupSegarBgLazyLoad();
        setupChipRow();
        setupLangSwitcher();

        setLanguage(initialLang);
      })
      .catch(function (err) {
        console.error(err);
        showError("network");
      });
  }

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  }

  // Guard ekspor untuk verifikasi lewat Node (tidak berpengaruh di browser).
  if (typeof module !== "undefined" && module.exports) {
    module.exports = {
      buildPhotoIndex: buildPhotoIndex,
      renderAppHtml: renderAppHtml,
      renderCategory: renderCategory,
      formatRupiah: formatRupiah,
      formatPrice: formatPrice,
      getShowcase: getShowcase,
      PHOTO_DIMS: PHOTO_DIMS,
      CARD_CATEGORIES: CARD_CATEGORIES
    };
  }
})();
</script>
</body>
</html>
